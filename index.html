<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DAPI — макет референса на сетке</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wdth,wght@12..36,75..150,300..900&display=swap">
<link rel="stylesheet" href="сетка.css">
<style>
  /* ── ВЕРТИКАЛЬ: высоты полос взяты с референса как есть ──
     ГОРИЗОНТАЛЬ: строго модуль 35. Оверлей — клавиша G. */
  body{background:var(--bg);margin:0}
  .win{width:100vw;height:100vh;position:relative;display:grid;
       grid-template-rows:33px 1fr;background:var(--bg);overflow:hidden}
  .win .wrap{max-width:none;height:auto;box-shadow:none}
  .chrome{background:var(--bg-deep);border-bottom:1px solid var(--line)}
  .zone-body{display:grid;grid-template-columns:repeat(42,minmax(0,1fr));min-height:0;position:relative}
  .zone-body > *{border-right:1px solid var(--line)}
  .zone-body > *:last-child{border-right:0}
  .центр{display:grid;grid-template-columns:subgrid;grid-template-rows:25px 1fr;min-height:0}
  .бок{display:grid;grid-template-rows:25px 1fr;min-height:0}
  .нижняя{display:grid;grid-template-columns:subgrid;grid-template-rows:25px 1fr;min-height:0;grid-column:1/-1}
  .правая{display:grid;grid-template-rows:25px 1fr 20px;min-height:0}
  .ff{grid-column:1/-1}
  .b{border-bottom:1px solid var(--line)}
  .t{border-top:1px solid var(--line)}
  .l{border-left:1px solid var(--line)}
  .fill{background:var(--bg-soft)}
  .field{background:var(--bg-lift)}
  .hi{background:var(--bg-hi)}

  /* ═══ ИНТРО · три блока поверх дерева/центра/ленты на время загрузки ═══ */
  .интро-оверлей{position:absolute;inset:0;z-index:50;background:var(--bg);
    cursor:pointer;transition:transform .75s cubic-bezier(.65,0,.35,1)}
  .интро-оверлей.уходит{transform:translateY(-100%)}
  .интро-1{display:flex;align-items:center;justify-content:center;background:var(--bg-deep)}
  .интро-марка{writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:var(--display);font-size:clamp(24px,2.6vw,42px);
    font-variation-settings:'wdth' 140,'wght' 900;letter-spacing:.1em;color:var(--fg)}
  .интро-2{position:relative;background:var(--bg-soft);cursor:default}
  #пиксель-канвас{position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges}
  .интро-подсказка{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
    background:rgba(31,31,31,.82);color:#fff;font:12px var(--ui);letter-spacing:.02em;
    pointer-events:none;z-index:5;transition:opacity .4s ease;
    animation:интро-подсказка-боунс 1.6s ease-in-out infinite}
  .интро-подсказка svg{width:14px;height:14px;flex:none}
  .интро-подсказка.скрыта{opacity:0}
  @keyframes интро-подсказка-боунс{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}
  @media (hover:hover) and (pointer:fine){
    .интро-подсказка{position:fixed;left:0;top:0;bottom:auto;animation:none}
  }
  @media (prefers-reduced-motion:reduce){.интро-подсказка{animation:none}}
  .интро-3{background:#1e1e1e;display:flex;flex-direction:column;min-height:0}
  .код-титлбар{flex:none;height:28px;display:flex;align-items:center;gap:6px;
    padding:0 10px;background:#252526;border-bottom:1px solid #161616}
  .код-точка{width:9px;height:9px;border-radius:50%}
  .код-точка.r{background:#ff5f56} .код-точка.y{background:#ffbd2e} .код-точка.g{background:#27c93f}
  .код-вкладка{margin-left:8px;font:11px var(--ui);color:#9d9d9d}
  .код-тело{display:flex;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
  .код-тело::-webkit-scrollbar{display:none}
  #код-gutter{margin:0;padding:14px 10px;text-align:right;color:#5a5a5a;
    font:16px/1.5 var(--mono);user-select:none}
  .код-текст-обёртка{flex:1;padding:14px 14px;overflow-x:hidden}
  #код-текст{margin:0;font:16px/1.5 var(--mono);white-space:pre;color:#d4d4d4}
  .tok-kw{color:#569cd6} .tok-str{color:#ce9178}
  .код-курсор{display:inline-block;width:7px;height:14px;background:#d4d4d4;
    vertical-align:text-bottom;animation:код-мигание 1s steps(1) infinite}
  @keyframes код-мигание{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.интро-оверлей{display:none}}
</style>
</head>

<div class="win" id="макет">

  <!-- 1 ─ верхняя полоса · девиз -->
  <div class="chrome grid">
    <div class="c42 девиз">
      <span class="марка">DAPI TEAM</span>
      <span class="шаг">придумать</span><span class="стрелка">→</span>
      <span class="шаг">сделать</span><span class="стрелка">→</span>
      <span class="шаг">продать</span>
    </div>
  </div>

  <!-- 2 ─ ТЕЛО
       дерево 5u   · навигация: скролл-спай с раскрытием разделов
       центр 24u   · ряд вкладок (второе меню) + контент (скроллится)
       правая 12u  · зацикленная CSS-анимация, кадры вплотную к линиям -->
  <div class="zone-body">

    <!-- навигация -->
    <nav class="c5" style="display:grid;grid-template-rows:25px 22px 1fr;min-height:0">
      <div class="b шапка-панели"><span>Explorer</span><span class="dim">...</span></div>
      <div class="b корень"><span class="уголок">⌄</span><span>DAPI</span></div>
      <div class="px дерево" id="дерево" style="padding-top:var(--s2);overflow:auto"></div>
    </nav>

    <!-- ЦЕНТР 20u · ряд вкладок + контент (единственная скроллящаяся зона) -->
    <main class="c24 центр">
      <div class="sub вкладки" id="вкладки"></div>
      <div class="контент" id="контент"></div>
    </main>

    <!-- ПРАВЫЙ БЛОК 17u · колонка разделов 3u + зацикленная лента 14u -->
    <div class="c1 бок">
      <div class="b" style="height:25px"></div>
      <div class="колонка" id="колонка"></div>
    </div>

    <aside class="c12 правая">
      <div class="b px vc" style="height:25px"><span class="ui">xxxxx</span></div>
      <div class="лента-окно"><div class="лента" id="лента"></div></div>
      <div class="t px vc" style="height:20px"><span class="micro">xxxxxxxxxxxx</span></div>
    </aside>
  </div>

  <!-- ── СЕТКА поверх макета ── -->
  <div class="сетка-оверлей"></div>
</div>

<script>
/* ═══ МЕХАНИКА · ДВА НЕЗАВИСИМЫХ БАРА ═══
   ЛЕВЫЙ: дерево (с раскрытием) + ряд вкладок — синхронны между собой,
          ведут по разделам сайта, реагируют на скролл #контент.
   ПРАВЫЙ: лента + колонка-индикатор 3u — живут своей жизнью,
          с левой навигацией НЕ связаны. ═══ */
const РАЗДЕЛЫ = JSON.parse(document.getElementById('разделы').textContent);
const дерево = document.getElementById('дерево');
const вкладки = document.getElementById('вкладки');
const контент = document.getElementById('контент');
const колонка = document.getElementById('колонка');

/* ── разметка ── */
РАЗДЕЛЫ.forEach((р, i) => {
  // дерево — все разделы, и основные, и окна
  const узел = document.createElement('div');
  узел.className = 'узел' + (р.основной ? '' : ' окно-узел');
  узел.dataset.ид = р.id;
  узел.innerHTML =
    `<div class="папка">
       <span class="уголок">›</span>
       <svg class="иконка-папки" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
         <path d="M1.5 3.5h4l1.2 1.6h7.8v7.4a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/>
       </svg>
       <span class="имя">${р.имя}</span>
       ${р.основной ? '' : '<span class="метка-окна">↗</span>'}
     </div>` +
    `<div class="пункты"><div class="внутри">` + р.пункты.map((п,j) =>
      `<div class="пункт" data-к="${р.id}" data-j="${j}">${п.т}</div>`).join('') + `</div></div>`;
  дерево.appendChild(узел);

  // вкладки — только помеченные "таб": сайт продаёт сайты
  if (р.таб) {
    const вк = document.createElement('div');
    вк.className = 'вкладка vc'; вк.dataset.ид = р.id;
    вк.innerHTML = `<span class="ui">${р.имя}</span>`;
    вкладки.appendChild(вк);
  }

  const сек = document.createElement('section');
  сек.className = 'секция p' + (р.основной ? '' : ' окно');
  сек.id = 'sec-' + р.id;
  сек.innerHTML =
    (р.основной ? '' : `<button class="назад">← к основному</button>`) +
    `<h2 class="display">${р.имя}</h2>` +
    `<p class="лид w14 mt">${р.лид}</p>` +
    р.пункты.map((п,j) =>
      `<div class="блок ${п.фото ? 'с-фото' : ''}" id="b-${р.id}-${j}">
         ${п.фото ? `<img class="портрет" src="${п.фото}" alt="">` : ''}
         <div>
           <h4 class="h4">${п.т}</h4>
           <p class="текст w21">${п.о}</p>
         </div>
       </div>`).join('') +
    (р.кейсы ? `<div class="блок" id="b-${р.id}-кейсы">
         <div>
           <h4 class="h4">кейсы</h4>
           <p class="текст w21">${р.кейсы_лид || ''}</p>
         </div>
       </div>
       <div class="кладка блок grid g3">` + р.кейсы.map((к,j) =>
        `<div class="card" id="b-${р.id}-кейс-${j}">
           <h4 class="h4">${к.т}</h4>
           <p class="текст sm mt">${к.о}</p>
         </div>`).join('') + `</div>` : '');
  контент.appendChild(сек);
});

const ОСНОВНЫЕ = РАЗДЕЛЫ.filter(р => р.основной).map(р => р.id);

/* ── синхронизация состояния ── */
let текущий = null;
function активировать(ид, тянуть = true) {
  if (ид === текущий) return;
  текущий = ид;
  дерево.querySelectorAll('.узел').forEach(у =>
    у.classList.toggle('раскрыт', у.dataset.ид === ид));
  вкладки.querySelectorAll('.вкладка').forEach(в => {
    const on = в.dataset.ид === ид;
    в.classList.toggle('активна', on);
    if (on && тянуть) в.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
  });
}

/* ── режим окна: доп. раздел показывается один, поверх основного потока ── */
function открытьОкно(ид) {
  контент.classList.add('в-окне');
  контент.querySelectorAll('.секция').forEach(с =>
    с.classList.toggle('видна', с.id === 'sec-' + ид));
  контент.scrollTop = 0;
  активировать(ид);
}
function закрытьОкно(кид) {
  контент.classList.remove('в-окне');
  контент.querySelectorAll('.секция').forEach(с => с.classList.remove('видна'));
  const цель = document.getElementById('sec-' + (кид || ОСНОВНЫЕ[0]));
  контент.scrollTop = цель.offsetTop;
  активировать(кид || ОСНОВНЫЕ[0]);
}
const вОкне = () => контент.classList.contains('в-окне');

/* ── скролл-спай: только по основному потоку ── */
const секции = ОСНОВНЫЕ.map(ид => document.getElementById('sec-' + ид));
контент.addEventListener('scroll', () => {
  if (вОкне()) return;
  let выбран = секции[0];
  const дно = контент.scrollTop + контент.clientHeight >= контент.scrollHeight - 4;
  if (дно) выбран = секции[секции.length - 1];
  else {
    const верх = контент.scrollTop + 40;
    for (const с of секции) if (с.offsetTop <= верх) выбран = с;
  }
  активировать(выбран.id.slice(4));
}, {passive:true});

/* ── переходы ── */
function перейти(ид, якорь) {
  const р = РАЗДЕЛЫ.find(x => x.id === ид);
  if (!р.основной) {                       // окно — попасть можно только из дерева
    открытьОкно(ид);
    if (якорь) document.getElementById(якорь)?.scrollIntoView({block:'start', behavior:'smooth'});
    return;
  }
  if (вОкне()) закрытьОкно(ид);
  const цель = якорь ? document.getElementById(якорь) : document.getElementById('sec-' + ид);
  контент.scrollTo({top: цель.offsetTop - 10, behavior:'smooth'});
  активировать(ид);
}
дерево.addEventListener('click', e => {
  const пункт = e.target.closest('.пункт');
  if (пункт) return перейти(пункт.dataset.к, `b-${пункт.dataset.к}-${пункт.dataset.j}`);
  const узел = e.target.closest('.узел');
  if (узел) перейти(узел.dataset.ид);
});
вкладки.addEventListener('click', e => {
  const в = e.target.closest('.вкладка'); if (в) перейти(в.dataset.ид);
});
контент.addEventListener('click', e => {
  if (e.target.closest('.назад')) закрытьОкно();
});

активировать(ОСНОВНЫЕ[0], false);

/* ══ ПРАВЫЙ БЛОК · сам по себе, с левой навигацией не связан ══
   лента едет бесконечно, колонка 3u — её собственный индикатор:
   подсвечивается та метка, чей блок сейчас проходит через окно. */
const ЛЕНТА = [
  {метка:'работы',  вид:'работа', сколько:4},   // скриншоты сайтов
  {метка:'письма',  вид:'письмо', сколько:3},   // благодарственные письма
  {метка:'лайв',    вид:'фото',   сколько:4}    // фото с работы
];
function кусок(пометить) {
  const ф = document.createDocumentFragment();
  ЛЕНТА.forEach((гр, i) => {
    const г = document.createElement('div');
    г.className = 'группа';
    if (пометить) г.dataset.гр = i;
    for (let k = 0; k < гр.сколько; k++) {
      const э = document.createElement('div');
      э.className = 'кадр ' + гр.вид;
      г.appendChild(э);
    }
    ф.appendChild(г);
  });
  return ф;
}
лента.appendChild(кусок(true));
лента.appendChild(кусок(false));   // дубль для бесшовности

/* индикатор правого блока */
ЛЕНТА.forEach((гр, i) => {
  const ст = document.createElement('div');
  ст.className = 'строка'; ст.dataset.гр = i;
  ст.innerHTML = `<span class="micro">${гр.метка}</span>`;
  колонка.appendChild(ст);
});
/* Индикатор ленты.
   Раньше опрашивал getBoundingClientRect каждый кадр — браузер пересчитывал
   раскладку 60 раз в секунду, и от этого подтормаживало дерево слева.
   Теперь позиции групп снимаются один раз, а дальше всё считается
   арифметикой по времени анимации, 8 опросов в секунду. */
const окно = document.querySelector('.лента-окно');
const метки = [...колонка.querySelectorAll('.строка')];
let центры = [], периодНабора = 0, активнаяГр = -1;

function обмерить() {
  const группы = [...лента.querySelectorAll('[data-гр]')];
  if (!группы.length) return;
  периодНабора = лента.scrollHeight / 2;          // высота одного набора
  центры = группы.map(г => г.offsetTop + г.offsetHeight / 2);
}
function следить() {
  if (!периодНабора) return;
  const анимация = лента.getAnimations()[0];
  const t = анимация ? (анимация.currentTime || 0) : 0;
  const длит = анимация ? (анимация.effect.getTiming().duration || 1) : 1;
  const сдвиг = (t % длит) / длит * периодНабора;   // насколько лента уехала вверх
  const цель = окно.clientHeight / 2 + сдвиг;
  let ближайшая = 0, мин = Infinity;
  центры.forEach((c, i) => {
    const d = Math.abs(c - цель);
    if (d < мин) { мин = d; ближайшая = i; }
  });
  if (ближайшая !== активнаяГр) {
    активнаяГр = ближайшая;
    метки.forEach((м, i) => м.classList.toggle('активна', i === ближайшая));
  }
}
addEventListener('resize', обмерить);
requestAnimationFrame(() => { обмерить(); следить(); setInterval(следить, 125); });

addEventListener('keydown', e => {
  if ('gGпП'.includes(e.key)) document.documentElement.classList.toggle('guides');
});
</script>

<script>
/* ═══ ИНТРО · 3 блока на месте дерева / центра / ленты, идёт по скроллу ═══
   Не видеофайлами и не таймером — колесо/свайп/стрелки двигают прогресс
   0→1, от него зависят и печать кода, и сцена с людьми (жест один общий,
   значит и кончаются вместе). Pixel Agents для этого не подходит: он
   рисует только реальную активность живых агентов, сценарий "доделали →
   обрадовались" ему не задать — люди и код собраны сами, canvas + текст. */
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try { if (sessionStorage.getItem('dapi-интро-показано')) return; } catch (e) {}

  const ДИСТАНЦИЯ = 2200;   // сколько "прокрутки" (px-эквивалент) нужно для полного прогресса
  const ПРАЗДНИК = 1300;    // сколько держим кадр радости перед уходом, мс

  const оверлей = document.createElement('div');
  оверлей.className = 'интро-оверлей grid';
  оверлей.innerHTML =
    `<div class="c5 интро-1"><span class="интро-марка">DAPI TEAM</span></div>` +
    `<div class="c24 интро-2">
       <canvas id="пиксель-канвас"></canvas>
       <div class="интро-подсказка" id="интроПодсказка">
         <svg viewBox="0 0 16 24" fill="none" stroke="currentColor" stroke-width="1.4">
           <rect x="1" y="1" width="14" height="22" rx="7"/>
           <line x1="8" y1="6" x2="8" y2="10" stroke-linecap="round"/>
         </svg>
         <span>Листай</span>
       </div>
     </div>` +
    `<div class="c13 интро-3">
       <div class="код-титлбар">
         <span class="код-точка r"></span><span class="код-точка y"></span><span class="код-точка g"></span>
         <span class="код-вкладка">index.html</span>
       </div>
       <div class="код-тело">
         <pre id="код-gutter"></pre>
         <div class="код-текст-обёртка"><pre id="код-текст"></pre></div>
       </div>
     </div>`;
  document.querySelector('.zone-body').appendChild(оверлей);
  const подсказка = document.getElementById('интроПодсказка');

  /* ── код: реальный, крупный фрагмент из этого же файла — не одна функция,
     а срез движка всего сайта (данные → рендер дерева/вкладок → активация) ── */
  const КОД = `const РАЗДЕЛЫ = JSON.parse(document.getElementById('разделы').textContent);
const дерево = document.getElementById('дерево');
const вкладки = document.getElementById('вкладки');
const контент = document.getElementById('контент');

РАЗДЕЛЫ.forEach((р, i) => {
  const узел = document.createElement('div');
  узел.className = 'узел' + (р.основной ? '' : ' окно-узел');
  узел.dataset.ид = р.id;
  дерево.appendChild(узел);

  if (р.таб) {
    const вк = document.createElement('div');
    вк.className = 'вкладка vc';
    вк.dataset.ид = р.id;
    вкладки.appendChild(вк);
  }

  const сек = document.createElement('section');
  сек.className = 'секция p' + (р.основной ? '' : ' окно');
  сек.id = 'sec-' + р.id;
  контент.appendChild(сек);
});

function активировать(ид, тянуть = true) {
  if (ид === текущий) return;
  текущий = ид;
  дерево.querySelectorAll('.узел').forEach(у =>
    у.classList.toggle('раскрыт', у.dataset.ид === ид));
  вкладки.querySelectorAll('.вкладка').forEach(в => {
    const on = в.dataset.ид === ид;
    в.classList.toggle('активна', on);
    if (on && тянуть) в.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
  });
}`;
  document.getElementById('код-gutter').textContent =
    КОД.split('\n').map((_, i) => i + 1).join('\n');
  const текстЭл = document.getElementById('код-текст');
  const кодТело = document.querySelector('.код-тело');

  function подсветить(s) {
    const М1 = String.fromCharCode(1), М2 = String.fromCharCode(2);
    return s
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/(['"][^'"]*['"])/g, М1 + '$1' + М2)
      .split(new RegExp(М1 + '|' + М2))
      .map((часть, i) => i % 2 === 1
        ? `<span class="tok-str">${часть}</span>`
        : часть.replace(/\b(function|const|let|if|return|new)\b/g, '<span class="tok-kw">$1</span>'))
      .join('');
  }

  /* ── пиксельные люди: 4 персонажа за 4 столами, нарисовано сами, без внешних файлов ── */
  const канвас = document.getElementById('пиксель-канвас');
  const ctx = канвас.getContext('2d');
  const ШИР = 160, ВЫС = 90;
  канвас.width = ШИР; канвас.height = ВЫС;
  ctx.imageSmoothingEnabled = false;

  const столы = ['#1f6feb', '#0e8a6d', '#c98a2c', '#a5586e'].map((цвет, i) => ({
    x: 22 + i * 38, y: 58, цвет, шаг: i % 2 === 0 ? 1 : -1
  }));
  const искры = [];

  function рисовать(t, celebrating) {
    ctx.clearRect(0, 0, ШИР, ВЫС);
    ctx.fillStyle = '#eef0f2'; ctx.fillRect(0, 0, ШИР, ВЫС);
    ctx.fillStyle = '#d8dbdf';
    for (let x = 0; x < ШИР; x += 20) ctx.fillRect(x, 66, 1, ВЫС - 66);

    столы.forEach((с, i) => {
      const фаза = t / 260 + i * 1.7;
      const прыжок = celebrating ? Math.abs(Math.sin(t / 140 + i)) * 7 : 0;
      const сдвиг = celebrating ? 0 : Math.sin(t / 900 + i * 2) * 4 * с.шаг;

      ctx.fillStyle = '#8a6a4a'; ctx.fillRect(с.x - 16, с.y, 32, 5);
      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(с.x + 7, с.y - 12, 10, 10);
      ctx.fillStyle = celebrating ? '#ffd23f' : (Math.sin(t / 150 + i * 3) > 0 ? '#5fd0ff' : '#1f6feb');
      ctx.fillRect(с.x + 8, с.y - 10, 8, 6);

      const cx = с.x + сдвиг, cy = с.y - прыжок;
      ctx.fillStyle = с.цвет; ctx.fillRect(cx - 6, cy - 14, 12, 13);
      ctx.fillStyle = '#f2c9a0'; ctx.fillRect(cx - 5, cy - 22, 10, 8);
      ctx.fillStyle = с.цвет;
      if (celebrating) {
        ctx.fillRect(cx - 9, cy - 24, 3, 10);
        ctx.fillRect(cx + 6, cy - 24, 3, 10);
        if (Math.random() < 0.15) искры.push({ x: cx + Math.random() * 16 - 8, y: cy - 26, t: 0 });
      } else {
        const ту = Math.sin(фаза * 2) * 2;
        ctx.fillRect(cx - 8, cy - 9 + ту, 3, 5);
        ctx.fillRect(cx + 5, cy - 9 - ту, 3, 5);
      }
    });

    for (let k = искры.length - 1; k >= 0; k--) {
      const s = искры[k]; s.t++; s.y -= 0.4;
      ctx.fillStyle = `rgba(255,196,64,${Math.max(0, 1 - s.t / 30)})`;
      ctx.fillRect(s.x, s.y, 2, 2);
      if (s.t > 30) искры.splice(k, 1);
    }
  }

  /* ── прогресс 0→1 от жеста (колесо / свайп / стрелки), а не от часов;
     часы остаются только для "живости" простоя (бобы/мигание монитора) ── */
  const старт = performance.now();
  let прогресс = 0;
  let празднуемС = 0;   // 0 = ещё не радуемся; иначе — момент старта радости
  let завершаем = false;

  function уйти() {
    if (завершаем) return;
    завершаем = true;
    оверлей.classList.add('уходит');
    try { sessionStorage.setItem('dapi-интро-показано', '1'); } catch (e) {}
    setTimeout(() => оверлей.remove(), 800);
  }

  function ввод(d) {
    if (завершаем || празднуемС) return;
    прогресс = Math.min(1, Math.max(0, прогресс + d / ДИСТАНЦИЯ));
    if (прогресс > 0.02) подсказка.classList.add('скрыта');
    if (прогресс >= 1) празднуемС = performance.now();
  }

  оверлей.addEventListener('wheel', e => { e.preventDefault(); ввод(e.deltaY); }, { passive: false });

  let последнийY = null;
  оверлей.addEventListener('touchstart', e => { последнийY = e.touches[0].clientY; }, { passive: true });
  оверлей.addEventListener('touchmove', e => {
    if (последнийY === null) return;
    const y = e.touches[0].clientY;
    ввод(последнийY - y);           // свайп вверх = как скролл вниз
    последнийY = y;
    e.preventDefault();
  }, { passive: false });

  оверлей.addEventListener('click', уйти);
  addEventListener('keydown', e => {
    if (завершаем) return;
    if (e.key === 'Escape') return уйти();
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      ввод(220);
    }
  });

  if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
    оверлей.addEventListener('mousemove', e => {
      подсказка.style.transform = `translate(${e.clientX + 18}px, ${e.clientY + 18}px)`;
    });
  }

  function тик(сейчас) {
    const реальное = сейчас - старт;
    const celebrating = празднуемС !== 0;
    рисовать(реальное, celebrating);

    const символов = Math.round(прогресс * КОД.length);
    текстЭл.innerHTML = подсветить(КОД.slice(0, символов)) + (прогресс < 1 ? '<span class="код-курсор"></span>' : '');
    кодТело.scrollTop = кодТело.scrollHeight;

    if (celebrating && сейчас - празднуемС > ПРАЗДНИК) { уйти(); return; }
    if (!завершаем) requestAnimationFrame(тик);
  }
  requestAnimationFrame(тик);
})();
</script>
