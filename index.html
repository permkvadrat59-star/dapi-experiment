<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DAPI — макет референса на сетке</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wdth,wght@12..36,75..150,300..900&display=swap">
<link rel="stylesheet" href="сетка.css">
<style>
  /* ── ВЕРТИКАЛЬ: высоты полос взяты с референса как есть ──
     ГОРИЗОНТАЛЬ: строго модуль 35. Оверлей — клавиша G. */
  body{background:var(--bg);margin:0}
  .win{width:100vw;height:100vh;position:relative;display:grid;
       grid-template-rows:33px 1fr;background:var(--bg);overflow:hidden}
  .win .wrap{max-width:none;height:auto;box-shadow:none}
  .chrome{background:var(--bg-deep);border-bottom:1px solid var(--line)}
  .zone-body{display:grid;grid-template-columns:repeat(42,minmax(0,1fr));min-height:0;position:relative}
  .zone-body > *{border-right:1px solid var(--line)}
  .zone-body > *:last-child{border-right:0}
  .центр{display:grid;grid-template-columns:subgrid;grid-template-rows:25px 1fr;min-height:0}
  .бок{display:grid;grid-template-rows:25px 1fr;min-height:0}
  .нижняя{display:grid;grid-template-columns:subgrid;grid-template-rows:25px 1fr;min-height:0;grid-column:1/-1}
  .правая{display:grid;grid-template-rows:25px 1fr 20px;min-height:0}
  .ff{grid-column:1/-1}
  .b{border-bottom:1px solid var(--line)}
  .t{border-top:1px solid var(--line)}
  .l{border-left:1px solid var(--line)}
  .fill{background:var(--bg-soft)}
  .field{background:var(--bg-lift)}
  .hi{background:var(--bg-hi)}

  /* ── ВРЕМЕННО: номера блоков для обсуждения, убрать потом ── */
  .блок-метка{position:absolute;top:8px;left:8px;z-index:30;
    width:26px;height:26px;border-radius:50%;background:#ff3b30;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font:800 14px var(--mono);box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none}
  .секция{position:relative}

  /* ═══ БЛОК 3 · CODE / VIBE / DESIGN / LIFE вместо старой ленты ═══ */
  .блок3-табы{display:flex;height:100%}
  .блок3-таб{flex:1;border:0;border-right:1px solid var(--line);background:none;cursor:pointer;
    font:700 11px var(--mono);letter-spacing:.06em;color:var(--fg-mute);
    transition:background .15s,color .15s}
  .блок3-таб:last-child{border-right:0}
  .блок3-таб:hover{color:var(--fg-dim);background:var(--bg-soft)}
  .блок3-таб.активен{color:var(--fg);background:var(--bg-hi)}
  .блок3-контент{position:relative;min-height:0}
  .блок3-панель{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
  .блок3-панель.активна{display:flex}
  .блок3-заглушка{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;gap:6px;font-family:var(--display);font-size:22px;
    font-variation-settings:'wdth' 130,'wght' 800;color:var(--fg-mute);letter-spacing:.04em}
  .блок3-заглушка span{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;
    color:var(--fg-mute);opacity:.6}

  /* код-панель — переехала из старого интро в раздел CODE, теперь живёт постоянно */
  .код-титлбар{flex:none;height:28px;display:flex;align-items:center;gap:6px;
    padding:0 10px;background:#252526;border-bottom:1px solid #161616}
  .код-точка{width:9px;height:9px;border-radius:50%}
  .код-точка.r{background:#ff5f56} .код-точка.y{background:#ffbd2e} .код-точка.g{background:#27c93f}
  .код-вкладка{margin-left:8px;font:11px var(--ui);color:#9d9d9d}
  .код-тело{display:flex;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;background:#1e1e1e}
  .код-тело::-webkit-scrollbar{display:none}
  #код-gutter{margin:0;padding:14px 10px;text-align:right;color:#5a5a5a;
    font:13px/1.5 var(--mono);user-select:none}
  .код-текст-обёртка{flex:1;padding:14px 14px;overflow-x:hidden}
  #код-текст{margin:0;font:13px/1.5 var(--mono);white-space:pre;color:#d4d4d4}
  .tok-kw{color:#569cd6} .tok-str{color:#ce9178} .tok-com{color:#6a9955}
  .код-курсор{display:inline-block;width:7px;height:13px;background:#d4d4d4;
    vertical-align:text-bottom;animation:код-мигание 1s steps(1) infinite}
  @keyframes код-мигание{50%{opacity:0}}

  /* ═══ ШАПКА · три зоны: марка слева (кнопка-рестарт) / девиз в центре / слоган справа ═══ */
  .девиз{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:100%;padding:0 var(--s3)}
  .марка-кнопка{justify-self:start;background:none;border:0;padding:0;cursor:pointer;
    display:flex;align-items:center}
  .марка-кнопка:hover .марка{color:var(--accent)}
  .девиз-центр{justify-self:center;font-family:var(--display);font-size:11px;
    font-variation-settings:'wdth' 125,'wght' 800;letter-spacing:.14em;color:var(--fg-dim);
    white-space:nowrap}
  .девиз-право{justify-self:end;font-family:var(--display);font-size:11px;
    font-variation-settings:'wdth' 125,'wght' 800;letter-spacing:.04em;
    color:#ff2d2d;white-space:nowrap}
</style>
</head>
<body>
<div class="win" id="макет">

  <!-- 1 ─ верхняя полоса · девиз -->
  <div class="chrome grid" style="position:relative">
    <span class="блок-метка">1</span>
    <div class="c42 девиз">
      <button class="марка-кнопка" id="маркаРестарт" title="Перезапустить интро">
        <span class="марка">DAPI TEAM</span>
      </button>

      <span class="девиз-право">хуйню не кодим</span>
    </div>
  </div>

  <!-- 2 ─ ТЕЛО
       дерево 5u   · навигация: скролл-спай с раскрытием разделов
       центр 24u   · ряд вкладок (второе меню) + контент (скроллится)
       правая 12u  · зацикленная CSS-анимация, кадры вплотную к линиям -->
  <div class="zone-body">

    <!-- навигация -->
    <nav class="c5" style="position:relative;display:grid;grid-template-rows:25px 22px 1fr;min-height:0">
      <span class="блок-метка">2</span>
      <div class="b шапка-панели"><span>Explorer</span><span class="dim">...</span></div>
      <div class="b корень"><span class="уголок">⌄</span><span>DAPI</span></div>
      <div class="px дерево" id="дерево" style="padding-top:var(--s2);overflow:auto"></div>
    </nav>

    <!-- ЦЕНТР 20u · ряд вкладок + контент (единственная скроллящаяся зона) -->
    <main class="c24 центр">
      <div class="sub вкладки" id="вкладки"></div>
      <div class="контент" id="контент"></div>
    </main>

    <!-- ПРАВЫЙ БЛОК 17u · колонка разделов 3u + зацикленная лента 14u -->
    <div class="c1 бок">
      <div class="b" style="height:25px"></div>
      <div class="колонка" id="колонка"></div>
    </div>

    <aside class="c12 правая" style="position:relative;grid-template-rows:25px 1fr">
      <span class="блок-метка">3</span>
      <div class="b блок3-табы">
        <button class="блок3-таб активен" data-таб="code">CODE</button>
        <button class="блок3-таб" data-таб="vibe">VIBE</button>
        <button class="блок3-таб" data-таб="design">DESIGN</button>
        <button class="блок3-таб" data-таб="life">LIFE</button>
      </div>
      <div class="блок3-контент">
        <div class="блок3-панель код активна" data-панель="code">
          <div class="код-титлбар">
            <span class="код-точка r"></span><span class="код-точка y"></span><span class="код-точка g"></span>
            <span class="код-вкладка">pentagon_hack.py</span>
          </div>
          <div class="код-тело">
            <pre id="код-gutter"></pre>
            <div class="код-текст-обёртка"><pre id="код-текст"></pre></div>
          </div>
        </div>
        <div class="блок3-панель" data-панель="vibe"><div class="блок3-заглушка">VIBE<span>скоро</span></div></div>
        <div class="блок3-панель" data-панель="design"><div class="блок3-заглушка">DESIGN<span>скоро</span></div></div>
        <div class="блок3-панель" data-панель="life"><div class="блок3-заглушка">LIFE<span>скоро</span></div></div>
      </div>
    </aside>
  </div>

  <!-- ── СЕТКА поверх макета ── -->
  <div class="сетка-оверлей"></div>
</div>

<script>
/* ═══ МЕХАНИКА · ДВА НЕЗАВИСИМЫХ БАРА ═══
   ЛЕВЫЙ: дерево (с раскрытием) + ряд вкладок — синхронны между собой,
          ведут по разделам сайта, реагируют на скролл #контент.
   ПРАВЫЙ: лента + колонка-индикатор 3u — живут своей жизнью,
          с левой навигацией НЕ связаны. ═══ */
const РАЗДЕЛЫ = JSON.parse(document.getElementById('разделы').textContent);
const дерево = document.getElementById('дерево');
const вкладки = document.getElementById('вкладки');
const контент = document.getElementById('контент');
const колонка = document.getElementById('колонка');

/* ── разметка ── */
РАЗДЕЛЫ.forEach((р, i) => {
  // дерево — все разделы, и основные, и окна
  const узел = document.createElement('div');
  узел.className = 'узел' + (р.основной ? '' : ' окно-узел');
  узел.dataset.ид = р.id;
  узел.innerHTML =
    `<div class="папка">
       <span class="уголок">›</span>
       <svg class="иконка-папки" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
         <path d="M1.5 3.5h4l1.2 1.6h7.8v7.4a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/>
       </svg>
       <span class="имя">${р.имя}</span>
       ${р.основной ? '' : '<span class="метка-окна">↗</span>'}
     </div>` +
    `<div class="пункты"><div class="внутри">` + р.пункты.map((п,j) =>
      `<div class="пункт" data-к="${р.id}" data-j="${j}">${п.т}</div>`).join('') + `</div></div>`;
  дерево.appendChild(узел);

  // вкладки — только помеченные "таб": сайт продаёт сайты
  if (р.таб) {
    const вк = document.createElement('div');
    вк.className = 'вкладка vc'; вк.dataset.ид = р.id;
    вк.innerHTML = `<span class="ui">${р.имя}</span>`;
    вкладки.appendChild(вк);
  }

  const сек = document.createElement('section');
  сек.className = 'секция p' + (р.основной ? '' : ' окно');
  сек.id = 'sec-' + р.id;
  сек.innerHTML =
    `<span class="блок-метка">${i + 4}</span>` +
    (р.основной ? '' : `<button class="назад">← к основному</button>`) +
    `<h2 class="display">${р.имя}</h2>` +
    `<p class="лид w14 mt">${р.лид}</p>` +
    р.пункты.map((п,j) =>
      `<div class="блок ${п.фото ? 'с-фото' : ''}" id="b-${р.id}-${j}">
         ${п.фото ? `<img class="портрет" src="${п.фото}" alt="">` : ''}
         <div>
           <h4 class="h4">${п.т}</h4>
           <p class="текст w21">${п.о}</p>
         </div>
       </div>`).join('') +
    (р.кейсы ? `<div class="блок" id="b-${р.id}-кейсы">
         <div>
           <h4 class="h4">кейсы</h4>
           <p class="текст w21">${р.кейсы_лид || ''}</p>
         </div>
       </div>
       <div class="кладка блок grid g3">` + р.кейсы.map((к,j) =>
        `<div class="card" id="b-${р.id}-кейс-${j}">
           <h4 class="h4">${к.т}</h4>
           <p class="текст sm mt">${к.о}</p>
         </div>`).join('') + `</div>` : '');
  контент.appendChild(сек);
});

const ОСНОВНЫЕ = РАЗДЕЛЫ.filter(р => р.основной).map(р => р.id);

/* ── синхронизация состояния ── */
let текущий = null;
function активировать(ид, тянуть = true) {
  if (ид === текущий) return;
  текущий = ид;
  дерево.querySelectorAll('.узел').forEach(у =>
    у.classList.toggle('раскрыт', у.dataset.ид === ид));
  вкладки.querySelectorAll('.вкладка').forEach(в => {
    const on = в.dataset.ид === ид;
    в.classList.toggle('активна', on);
    if (on && тянуть) в.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
  });
}

/* ── режим окна: доп. раздел показывается один, поверх основного потока ── */
function открытьОкно(ид) {
  контент.classList.add('в-окне');
  контент.querySelectorAll('.секция').forEach(с =>
    с.classList.toggle('видна', с.id === 'sec-' + ид));
  контент.scrollTop = 0;
  активировать(ид);
}
function закрытьОкно(кид) {
  контент.classList.remove('в-окне');
  контент.querySelectorAll('.секция').forEach(с => с.classList.remove('видна'));
  const цель = document.getElementById('sec-' + (кид || ОСНОВНЫЕ[0]));
  контент.scrollTop = цель.offsetTop;
  активировать(кид || ОСНОВНЫЕ[0]);
}
const вОкне = () => контент.classList.contains('в-окне');

/* ── скролл-спай: только по основному потоку ── */
const секции = ОСНОВНЫЕ.map(ид => document.getElementById('sec-' + ид));
контент.addEventListener('scroll', () => {
  if (вОкне()) return;
  let выбран = секции[0];
  const дно = контент.scrollTop + контент.clientHeight >= контент.scrollHeight - 4;
  if (дно) выбран = секции[секции.length - 1];
  else {
    const верх = контент.scrollTop + 40;
    for (const с of секции) if (с.offsetTop <= верх) выбран = с;
  }
  активировать(выбран.id.slice(4));
}, {passive:true});

/* ── переходы ── */
function перейти(ид, якорь) {
  const р = РАЗДЕЛЫ.find(x => x.id === ид);
  if (!р.основной) {                       // окно — попасть можно только из дерева
    открытьОкно(ид);
    if (якорь) document.getElementById(якорь)?.scrollIntoView({block:'start', behavior:'smooth'});
    return;
  }
  if (вОкне()) закрытьОкно(ид);
  const цель = якорь ? document.getElementById(якорь) : document.getElementById('sec-' + ид);
  контент.scrollTo({top: цель.offsetTop - 10, behavior:'smooth'});
  активировать(ид);
}
дерево.addEventListener('click', e => {
  const пункт = e.target.closest('.пункт');
  if (пункт) return перейти(пункт.dataset.к, `b-${пункт.dataset.к}-${пункт.dataset.j}`);
  const узел = e.target.closest('.узел');
  if (узел) перейти(узел.dataset.ид);
});
вкладки.addEventListener('click', e => {
  const в = e.target.closest('.вкладка'); if (в) перейти(в.dataset.ид);
});
контент.addEventListener('click', e => {
  if (e.target.closest('.назад')) закрытьОкно();
});

активировать(ОСНОВНЫЕ[0], false);

addEventListener('keydown', e => {
  if ('gGпП'.includes(e.key)) document.documentElement.classList.toggle('guides');
});
</script>

<script>
/* ═══ КНОПКА МАРКИ · клик по DAPI TEAM перезапускает интро ═══

/* ═══ БЛОК 3 · вкладки CODE / VIBE / DESIGN / LIFE ═══ */
document.querySelectorAll('.блок3-таб').forEach(таб => {

    document.querySelectorAll('.блок3-панель').forEach(п =>

/* ═══ CODE · печать шуточного "взлома Пентагона" по скроллу всей страницы.
   Монотонно: прогресс — это МАКСИМУМ scrollTop, когда-либо достигнутый,
   а не текущий — поэтому скролл назад ничего не стирает, только вперёд
   дописывает дальше. Код заведомо длиннее, чем нужно на весь скролл сайта,
   с запасом (три захода — Пентагон / НАСА / Зона 51) — чтобы не кончался
   на середине страницы. ═══ */
(function () {
  const контент = document.getElementById('контент');
  const gutterЭл = document.getElementById('код-gutter');
  const текстЭл = document.getElementById('код-текст');
  const кодТело = document.querySelector('.блок3-панель.код .код-тело');

  function заход(номер, цель, файл) {
    return `# ═══ ПОПЫТКА №${номер}: ВЗЛОМ «${цель}» ═══
# DAPI TEAM — хуйню не кодим (но иногда прикалываемся)
# не пытайтесь повторить — там наверняка уже читают этот файл

import os, sys, time, random

TARGET = "${файл}"
CLASSIFIED_PORTS = [22, 80, 443, 1337, 31337, 42069]
PROXY_CHAIN = ["antarctica", "n_korea_wifi", "starbucks_free_wifi", "соседский_роутер"]

def print_banner():
    print("╔══════════════════════════════════════════╗")
    print("║   ХУЙНЮ НЕ КОДИМ — PENETRATION TEST v2.6  ║")
    print("║   (шутка. мы просто верстаем сайты)       ║")
    print("╚══════════════════════════════════════════╝")

def ping_mainframe():
    print(f"[*] resolving {TARGET} ...")
    print(f"[+] {TARGET} resolved to 8.8.8.8 (легитимно на 100%)")
    for port in CLASSIFIED_PORTS:
        state = random.choice(["OPEN", "OPEN", "OPEN|FILTERED"])
        print(f"[+] port {port}/tcp {state} — nice security guys, really")
    print("[*] fingerprinting OS... Windows XP SP1 detected (2026 год, серьёзно?)")

def bypass_firewall():
    print("[*] launching ping of death (2003 edition, но работает)")
    print("[*] injecting SQL: ' OR 1=1; DROP TABLE democracy; --")
    print("[!] WAF BLOCKED REQUEST")
    print("[*] retry капсом: ' OR 1=1--")
    print("[+] ACCESS GRANTED (у них был пароль password123)")
    print("[*] escalating privileges: sudo su root --i-am-totally-admin")
    print("[+] you are now ROOT. поздравляем, это статья")

def download_top_secret_files():
    print("[*] locating FINAL_v3_USE_THIS_ONE_REALLY_FINAL.txt")
    total = 137
    for i in range(0, total + 1, 11):
        pct = min(100, int(i / total * 100))
        bar = "█" * (pct // 5) + "░" * (20 - pct // 5)
        print(f"\r[{bar}] {pct}%  качаем на 56.6 kbit/s (dial-up gang)")
    print("[+] скачано. содержимое: [ЗАСЕКРЕЧЕНО ЮРОТДЕЛОМ DAPI]")
    print("[i] на самом деле там просто рецепт борща от бабушки Ильи")

def deploy_rgb_hacking_module():
    print("[*] устанавливаем больше RGB (скорость взлома +40%, доказано наукой)")
    print("[*] переключаем подсветку клавиатуры на matrix-green")
    print("[*] печатаем очень быстро двумя руками по клавиатуре")
    print("[+] скорость взлома: MAXIMUM OVERDRIVE")

def cover_tracks():
    print("[*] удаляем логи: rm -rf /var/log/* (классика)")
    for hop in PROXY_CHAIN:
        print(f"[*] маршрутизируем трафик через {hop} ...")
    print("[*] вину на Северную Корею, как велит традиция")
    print("[+] следы заметены. шанс спалиться: 146%")

def main():
    print_banner()
    ping_mainframe()
    bypass_firewall()
    download_top_secret_files()
    deploy_rgb_hacking_module()
    cover_tracks()
    print()
    print("[✓] МИССИЯ ВЫПОЛНЕНА. «${цель}» взломан (не совсем)")
    print("[✓] на самом деле мы просто верстаем сайты в Перми")
    print("[✓] DAPI TEAM — хуйню не кодим")

if __name__ == "__main__":
    main()

`;
  }

  const КОД_ВЗЛОМ =
    заход(1, 'ПЕНТАГОН', 'pentagon.mil') +
    '\n\n' + заход(2, 'НАСА', 'nasa.gov') +
    '\n\n' + заход(3, 'ЗОНА-51', 'area51.gov');

  function подсветить(s) {
    s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const тайники = [];
    function спрятать(html) { тайники.push(html); return '\u0000' + (тайники.length - 1) + '\u0000'; }
    s = s.replace(/#[^\n]*/g, m => спрятать(`<span class="tok-com">${m}</span>`));
    s = s.replace(/(['"])((?:(?!\1)[^\\]|\\.)*)\1/g, m => спрятать(`<span class="tok-str">${m}</span>`));
    s = s.replace(/\b(def|import|from|if|__name__|__main__|return|for|in|print|True|False|None|as|while)\b/g,
      '<span class="tok-kw">$1</span>');
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => тайники[i]);
    return s;
  }

  const СКОРОСТЬ = 0.85; // символов кода на пиксель прокрутки
  let максСкролл = 0;

  контент.addEventListener('scroll', () => {
    максСкролл = Math.max(максСкролл, контент.scrollTop);
  }, { passive: true });

  let прошлоСимволов = -1;
  function тикКод() {
    const символов = Math.min(КОД_ВЗЛОМ.length, Math.floor(максСкролл * СКОРОСТЬ));
    if (символов !== прошлоСимволов) {
      прошлоСимволов = символов;
      const показано = КОД_ВЗЛОМ.slice(0, символов);
      // gutter растёт вместе с текстом — иначе он сразу показывает все ~230 строк,
      // контейнер становится "высоким" с первого кадра, и автоскролл к низу
      // утаскивает к ещё не написанным строкам
      const строк = показано.split('\n').length;
      gutterЭл.textContent = Array.from({ length: строк }, (_, i) => i + 1).join('\n');
      текстЭл.innerHTML = подсветить(показано) +
        (символов < КОД_ВЗЛОМ.length ? '<span class="код-курсор"></span>' : '');
      кодТело.scrollTop = кодТело.scrollHeight;
    }
    requestAnimationFrame(тикКод);
  }
  requestAnimationFrame(тикКод);
})();
</script>
